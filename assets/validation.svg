<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img"><title>Input validation rejects invalid requests before route logic</title><style>text{font-family:Arial,sans-serif;font-size:22px;fill:white;text-anchor:middle}rect{fill:#4A1830;rx:10}.line{stroke:#E0007A;stroke-width:4;fill:none;marker-end:url(#arrow)}.label{fill:#141414;font-size:18px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#E0007A"/></marker></defs><rect x="30" y="70" width="220" height="65"/><text x="140.0" y="109">JSON request</text><rect x="370" y="70" width="250" height="65"/><text x="495.0" y="109">Input model</text><rect x="710" y="70" width="260" height="65"/><text x="840.0" y="109">Route logic</text><rect x="370" y="290" width="250" height="65"/><text x="495.0" y="329">Invalid: 422</text><rect x="710" y="290" width="260" height="65"/><text x="840.0" y="329">Response model</text><path class="line" d="M250 102 H360"/><path class="line" d="M620 102 H700"/><path class="line" d="M495 135 V280"/><path class="line" d="M840 135 V280"/><text class="label" x="500" y="420">Only model-valid input reaches the route.</text></svg>